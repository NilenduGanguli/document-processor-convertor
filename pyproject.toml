[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "document-processor-convertor"
version = "0.1.0"
description = "Any supported document input -> positional markdown (PMD) in S3, indexed in Postgres."
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    # /api/v1/process is a multipart upload; FastAPI parses those through python-multipart.
    "python-multipart",
    "uvicorn[standard]",
    "pydantic>=2",
    "pydantic-settings",
    "boto3",
    "psycopg[binary]",
    "httpx",
    "pymupdf",
    "openpyxl",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]
# The arrange pass's Vertex provider (SPEC-DOCTREE-1 §10). Optional on purpose: the client
# imports google-genai lazily and reports the provider unavailable when absent, so the base
# image carries no Google SDK unless a deployment opts in.
arrange-vertex = [
    "google-genai",
]

[tool.setuptools]
packages = ["dpc"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
